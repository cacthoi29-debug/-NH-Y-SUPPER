<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Độ Nhạy SUPPER</title>

<!-- ===== PHẦN PWA ĐỂ TẠO WEB CHIP VÀ THÊM VÀO MÀN HÌNH CHÍNH ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Độ Nhạy SUPPER">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933232.png">
<!-- ============================================================= -->

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  
  body {
    min-height:100vh;
    /* --- DÁN LINK ẢNH CỦA BẠN VÀO ĐÂY --- */
    background: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
    background-size: cover;
    display:flex; flex-direction:column;
    align-items:center; padding:30px 16px;
    color:#fff;
  }

  body::before {
    content: '';
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(5, 10, 20, 0.75);
    z-index: -1;
    backdrop-filter: blur(5px);
  }

  h1 { 
    font-size:22px; letter-spacing:2px; margin-bottom:24px; 
    color:#fff; text-align:center; 
    text-shadow: 0 0 10px #ff6600, 0 0 20px #ff6600;
    text-transform: uppercase;
  }

  .input-box {
    display:flex; flex-direction: column; gap:12px; 
    width:100%; max-width:380px; margin-bottom:20px;
    background: rgba(255, 255, 255, 0.05);
    padding: 16px; border-radius: 16px;
    border: 1px solid rgba(255, 102, 0, 0.5);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .input-box input {
    width: 100%; padding:16px 18px; border-radius:12px; 
    border:2px solid rgba(255,255,255,0.2); background: rgba(0, 0, 0, 0.7); 
    color:#ffcc00; font-size:16px; outline:none; transition: 0.3s;
  }
  .input-box input:focus { border-color: #ff6600; box-shadow: 0 0 10px rgba(255, 102, 0, 0.5); }
  .input-box input::placeholder { color:#889; font-size: 15px; }

  .input-box button {
    width: 100%; padding:16px 20px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(135deg,#ff6600,#ff00e0); color:#fff;
    font-weight:bold; font-size:16px; text-transform: uppercase;
    box-shadow: 0 0 15px rgba(255, 102, 0, 0.6); transition: 0.2s;
  }
  .input-box button:active { transform:scale(0.96); }

  .device-name {
    font-size:16px; color:#00f0ff; margin-bottom:16px; text-align:center;
    min-height:20px; letter-spacing:1px; font-weight:bold; text-shadow: 0 0 8px #00f0ff;
  }

  .params { 
    width:100%; max-width:380px; background: rgba(10, 15, 25, 0.7);
    backdrop-filter: blur(10px); padding: 15px; border-radius: 16px; 
    border: 1px solid rgba(255, 102, 0, 0.3); box-shadow: 0 8px 32px rgba(255, 102, 0, 0.2);
  }

  .row {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 12px; margin:8px 0; border-radius:10px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    font-size:15px; color:#ddd; transition: 0.3s;
  }
  .row:hover { background: rgba(255, 102, 0, 0.15); border-color: #ff6600; }
  
  .row span:first-child { color: #eee; }
  .row span:last-child { 
    color:#ffcc00; font-weight:bold; font-size:18px; 
    background: rgba(0, 0, 0, 0.6); padding: 6px 14px; border-radius: 8px;
    text-shadow: 0 0 8px #ffcc00; min-width: 60px; text-align: center;
  }

  .status { margin-top:22px; font-size:14px; color:#0f0; text-align: center; font-weight: bold; }
  .status::before { content:'● '; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0.3; } }
</style>
</head>
<body>

<h1>⚡ ĐỘ NHẠY SUPPER ⚡</h1>

<div class="input-box">
  <input id="phoneInput" type="text" placeholder="Nhập bất kỳ thiết bị nào...">
  <button onclick="applyPhone()">TẠO ĐỘ NHẠY SUPPER</button>
</div>

<div class="device-name" id="deviceName">CHƯA CHỌN THIẾT BỊ</div>

<div class="params">
  <div class="row"><span>Nhìn xung quanh</span><span id="p1">--</span></div>
  <div class="row"><span>Ống ngắm hồng tâm</span><span id="p2">--</span></div>
  <div class="row"><span>Ống ngắm 2x</span><span id="p3">--</span></div>
  <div class="row"><span>Ống ngắm 4x</span><span id="p4">--</span></div>
  <div class="row"><span>Ống ngắm súng ngắm</span><span id="p5">--</span></div>
  <div class="row"><span>Nút camera tự do</span><span id="p6">--</span></div>
</div>

<div class="status" id="status">CHỜ NHẬP THIẾT BỊ</div>

<script>
let lastPhone = "";
let lastStats = { p1: 0, p2: 0, p3: 0, p4: 0, p5: 0, p6: 0 };

function clamp(num, min, max) { return Math.min(Math.max(num, min), max); }

function getMaxNumber(str) {
  let numbers = str.match(/\d+/g);
  if (!numbers) return 0;
  return Math.max(...numbers.map(Number));
}

function getBaseStats(name) {
  const n = name.toLowerCase();
  let basePower = 160;
  
  let num = getMaxNumber(n);
  if (num > 0) {
    if (num >= 20) basePower = 185;
    else if (num >= 14) basePower = 175;
    else if (num >= 10) basePower = 165;
    else if (num >= 6) basePower = 155;
    else basePower = 145;
  }

  if (n.includes("pro") || n.includes("ultra") || n.includes("plus") || n.includes("max")) basePower += 10;
  if (n.includes("gaming") || n.includes("rog") || n.includes("red magic") || n.includes("black shark") || n.includes("legion")) basePower = 200;

  if (n.includes("iphone") || n.includes("ipad") || n.includes("ios") || n.includes("apple")) {
    if (n.includes("se") || n.includes("5") || n.includes("6")) basePower = 145;
    if (n.includes("7") || n.includes("8")) basePower = 160;
    if (n.includes("x") || n.includes("11")) basePower = 175;
    if (n.includes("12") || n.includes("13")) basePower = 185;
    if (n.includes("14") || n.includes("15") || n.includes("16")) basePower = 195;
  }
  else if (n.includes("samsung") || n.includes("galaxy") || n.includes("ss")) {
    if (n.includes("s2") || n.includes("note2")) basePower = 190;
    else if (n.includes("note") || n.includes("fold") || n.includes("flip")) basePower = 185;
    else if (n.includes("a") || n.includes("m") || n.includes("j")) basePower = 155;
  }
  else if (n.includes("xiaomi") || n.includes("redmi") || n.includes("poco") || n.includes("mi ")) {
    if (n.includes("note") || n.includes("k")) basePower = 175;
    if (n.includes("f") || n.includes("pro")) basePower = 190;
  }
  else if (n.includes("oppo") || n.includes("vivo") || n.includes("realme") || n.includes("oneplus") || n.includes("nubia") || n.includes("zte") || n.includes("meizu")) {
    if (n.includes("find") || n.includes("reno") || n.includes("gt") || n.includes("pro")) basePower = 185;
    else basePower = 165;
  }
  else if (n.includes("nokia") || n.includes("vsmart") || n.includes("infinix") || n.includes("tecno") || n.includes("itel") || n.includes("mobell")) {
    basePower = 150;
  }

  basePower = clamp(basePower, 120, 200);

  let p1 = basePower;
  let p2 = clamp(p1 - 15, 80, 200);
  let p3 = clamp(p2 - 20, 60, 200);
  let p4 = clamp(p3 - 20, 40, 200);
  let p5 = clamp(p4 - 25, 30, 200);
  let p6 = clamp(p1 + 5, 100, 200);

  return { p1, p2, p3, p4, p5, p6 };
}

function applyPhone() {
  const input = document.getElementById("phoneInput").value.trim();

  if (!input) {
    document.getElementById("deviceName").textContent = "⚠ VUI LÒNG NHẬP TÊN MÁY!";
    return;
  }

  document.getElementById("phoneInput").blur();

  if (input.toLowerCase() === lastPhone.toLowerCase()) {
    document.getElementById("status").textContent = "THIẾT BỊ ĐÃ ĐƯỢC TỐI ƯU";
    return;
  }

  lastPhone = input;
  let base = getBaseStats(input);
  let newStats = {};
  let isDuplicate = true;
  let attempts = 0;

  while (isDuplicate && attempts < 100) {
    attempts++;
    let p1 = clamp(base.p1 + Math.floor(Math.random() * 11) - 5, 80, 200);
    let p2 = clamp(base.p2 + Math.floor(Math.random() * 11) - 5, 60, 200);
    let p3 = clamp(base.p3 + Math.floor(Math.random() * 11) - 5, 40, 200);
    let p4 = clamp(base.p4 + Math.floor(Math.random() * 11) - 5, 30, 200);
    let p5 = clamp(base.p5 + Math.floor(Math.random() * 11) - 5, 20, 200);
    let p6 = clamp(base.p6 + Math.floor(Math.random() * 11) - 5, 80, 200);

    if (p3 >= p2) p3 = p2 - Math.floor(Math.random() * 10) - 5;
    if (p4 >= p3) p4 = p3 - Math.floor(Math.random() * 10) - 5;
    if (p5 >= p4) p5 = p4 - Math.floor(Math.random() * 10) - 5;

    newStats = { p1, p2, p3, p4, p5, p6 };

    if (p1 !== lastStats.p1 || p2 !== lastStats.p2 || p3 !== lastStats.p3 || p4 !== lastStats.p4 || p5 !== lastStats.p5 || p6 !== lastStats.p6) {
      isDuplicate = false; 
    }
  }

  lastStats = newStats;

  document.getElementById("deviceName").textContent = "📱 " + input.toUpperCase();
  document.getElementById("status").textContent = "HỆ THỐNG ĐANG HOẠT ĐỘNG";
  document.getElementById("p1").textContent = newStats.p1;
  document.getElementById("p2").textContent = newStats.p2;
  document.getElementById("p3").textContent = newStats.p3;
  document.getElementById("p4").textContent = newStats.p4;
  document.getElementById("p5").textContent = newStats.p5;
  document.getElementById("p6").textContent = newStats.p6;
}

document.getElementById("phoneInput").addEventListener("keypress", function(e){
  if (e.key === "Enter") applyPhone();
});
</script>

</body>
</html>
